<!doctype html>
<html>
<head><title>Add Website</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container">
<h2>Add Website</h2>
<form method="post">
    <div class="mb-3"><input name="name" placeholder="Name (e.g. Website A)" required class="form-control"></div>
    <div class="mb-3"><input name="url" placeholder="URL" required class="form-control"></div>
    <div class="mb-3"><select name="type" class="form-select">
        <option>e-commerce</option><option>ticketing</option><option>gaming</option><option>service-based</option>
    </select></div>
    <div class="mb-3"><select name="currency" class="form-select"><option>INR</option><option>USD</option><option>EUR</option></select></div>
    <div class="mb-3"><input name="ticket_size" type="number" step="0.01" placeholder="Ticket Size" required class="form-control"></div>
    <div class="mb-3"><input name="region" placeholder="Region" class="form-control"></div>
    <div class="mb-3"><input name="language" placeholder="Language" class="form-control"></div>
    <button class="btn btn-primary">Save</button>
    <a href="/" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
